<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Lending Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="bg-primary text-white py-3 mb-3">
    <div class="container">
      <h1 class="m-0">Book Lending Tracker</h1>
      <p class="m-0 mt-1">Keep track of what you lent, to whom, and when it is due.</p>
    </div>
  </header>

  <main class="container">

    <section class="card mb-3">
      <h2 class="card-title">Lend a book</h2>

      <form id="loan-form" novalidate>
        <div class="form-group">
          <label for="title" class="form-label">Title</label>
          <div class="d-flex flex-wrap align-center gap-1">
            <input type="text" id="title" class="form-control" required>
            <span id="title-error" class="form-error"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="author" class="form-label">Author</label>
          <div class="d-flex flex-wrap align-center gap-1">
            <input type="text" id="author" class="form-control" required>
            <span id="author-error" class="form-error"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="borrower" class="form-label">Borrower</label>
          <div class="d-flex flex-wrap align-center gap-1">
            <input type="text" id="borrower" class="form-control" required>
            <span id="borrower-error" class="form-error"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="dueDate" class="form-label">Due date</label>
          <div class="d-flex flex-wrap align-center gap-1">
            <input type="date" id="dueDate" class="form-control" required>
            <span id="dueDate-error" class="form-error"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="genre" class="form-label">Genre</label>
          <div class="d-flex flex-wrap align-center gap-1">
            <select id="genre" class="form-control" required>
              <option value="">-- Choose a genre --</option>
              <option value="Fiction">Fiction</option>
              <option value="Science">Science</option>
              <option value="History">History</option>
              <option value="Technology">Technology</option>
            </select>
            <span id="genre-error" class="form-error"></span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Add loan</button>
      </form>
    </section>

    <section class="card mb-3">
      <h2 class="card-title">Lent books</h2>

      <div class="d-flex gap-2 mb-2">
        <div class="stat">
          <span class="stat-label">Total loans</span>
          <span id="total-loans" class="stat-value">0</span>
        </div>
        <div class="stat stat-danger">
          <span class="stat-label">Overdue loans</span>
          <span id="overdue-loans" class="stat-value">0</span>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Borrower</th>
              <th>Due date</th>
              <th>Genre</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="loan-table-body"></tbody>
        </table>
      </div>

      <p id="empty-msg" class="text-muted text-center">No books lent yet.</p>
    </section>

  </main>

  <footer class="bg-white border-top py-2">
    <div class="container">
      <p class="m-0 text-center text-muted text-small">&copy; 2026 Floid Likafi &middot; Web Technologies</p>
    </div>
  </footer>

  <script src="library.js"></script>
  <script src="app.js"></script>
</body>
</html>
